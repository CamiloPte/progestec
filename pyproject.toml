[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "alembic/versions",
    "venv",
    ".venv",
    "uploads",
]

[tool.ruff.lint]
# Empezamos conservador: solo errores reales. Iremos endureciendo.
# E = pycodestyle errors, F = pyflakes, B = flake8-bugbear, I = isort
select = ["E", "F", "B", "I"]
ignore = [
    "E501",  # line too long (lo maneja el formatter en otro paso)
    "B008",  # do not perform function call in argument defaults (FastAPI usa Depends() así)
    "B904",  # raise from (lo iremos arreglando módulo a módulo)
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402", "F401"]
"app/db/base.py" = ["F401"]              # importa modelos para que Alembic los detecte
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
