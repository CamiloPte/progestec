name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "progestec-front/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "progestec-front/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    name: build (ng build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: progestec-front

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: progestec-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build -- --configuration=production
