name: catalog-ci

on:
  push:
    branches: [main]
    paths:
      - "catalog-service/**"
      - ".github/workflows/catalog-ci.yml"
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: catalog-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check src/server.js
