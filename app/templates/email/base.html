<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        /* Reset */
        body, table, td, p, a, li, blockquote {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        table, td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }
        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }
        
        /* Base Styles */
        body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #1a5c3a 0%, #2d8659 100%);
            padding: 32px 40px;
            text-align: center;
        }
        
        .logo {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0;
        }
        
        .tagline {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-top: 4px;
        }
        
        /* Content */
        .content {
            padding: 40px;
        }
        
        .greeting {
            font-size: 18px;
            color: #333333;
            margin: 0 0 20px 0;
        }
        
        .message {
            font-size: 15px;
            color: #555555;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }
        
        /* Status Box */
        .status-box {
            background-color: #f8f9fa;
            border-left: 4px solid #1a5c3a;
            padding: 20px 24px;
            margin: 24px 0;
            border-radius: 0 8px 8px 0;
        }
        
        .status-label {
            font-size: 12px;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0 0 8px 0;
        }
        
        .status-value {
            font-size: 20px;
            font-weight: 600;
            color: #1a5c3a;
            margin: 0;
        }
        
        /* Info Grid */
        .info-grid {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 24px;
            margin: 24px 0;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5e5;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-size: 14px;
            color: #666666;
        }
        
        .info-value {
            font-size: 14px;
            color: #333333;
            font-weight: 500;
            text-align: right;
        }
        
        /* CTA Button */
        .cta-container {
            text-align: center;
            margin: 32px 0;
        }
        
        .cta-button {
            display: inline-block;
            background-color: #1a5c3a;
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        
        .cta-button:hover {
            background-color: #155230;
        }
        
        /* Alert Boxes */
        .alert {
            padding: 16px 20px;
            border-radius: 8px;
            margin: 24px 0;
            font-size: 14px;
        }
        
        .alert-warning {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
        }
        
        .alert-success {
            background-color: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
        }
        
        .alert-info {
            background-color: #d1ecf1;
            border: 1px solid #17a2b8;
            color: #0c5460;
        }
        
        /* Footer */
        .footer {
            background-color: #f8f9fa;
            padding: 32px 40px;
            text-align: center;
            border-top: 1px solid #e5e5e5;
        }
        
        .footer-text {
            font-size: 13px;
            color: #666666;
            margin: 0 0 12px 0;
            line-height: 1.5;
        }
        
        .footer-contact {
            font-size: 13px;
            color: #888888;
            margin: 0;
        }
        
        .footer-contact a {
            color: #1a5c3a;
            text-decoration: none;
        }
        
        /* Responsive */
        @media screen and (max-width: 600px) {
            .content, .header, .footer {
                padding: 24px 20px !important;
            }
            
            .logo {
                font-size: 24px;
            }
            
            .info-row {
                flex-direction: column;
                gap: 4px;
            }
            
            .info-value {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <table role="presentation" cellspacing="0" cellpadding="0" width="100%" style="background-color: #f5f5f5; border-collapse: collapse;">
        <tr>
            <td style="padding: 40px 20px;">
                <table role="presentation" cellspacing="0" cellpadding="0" width="100%" class="email-container" style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); border-collapse: collapse;">
                    <!-- Header -->
                    <tr>
                        <td class="header" style="background-color: #1a5c3a; padding: 32px 40px; text-align: center;">
                            <h1 class="logo" style="color: #ffffff; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin: 0;">🔧 ProGesTec</h1>
                            <p class="tagline" style="color: rgba(255, 255, 255, 0.9); font-size: 14px; margin-top: 4px; margin-bottom: 0;">Servicio Técnico Profesional</p>
                        </td>
                    </tr>
                    
                    <!-- Content -->
                    <tr>
                        <td class="content" style="padding: 40px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td class="footer" style="background-color: #f8f9fa; padding: 32px 40px; text-align: center; border-top: 1px solid #e5e5e5;">
                            <p class="footer-text" style="font-size: 13px; color: #666666; margin: 0 0 12px 0; line-height: 1.5;">
                                Este correo fue enviado automáticamente por el sistema de ProGesTec.<br>
                                Por favor no responda a este mensaje.
                            </p>
                            <p class="footer-contact" style="font-size: 13px; color: #888888; margin: 0;">
                                📞 {{ company_phone }} | ✉️ <a href="mailto:{{ company_email }}" style="color: #1a5c3a; text-decoration: none;">{{ company_email }}</a>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
